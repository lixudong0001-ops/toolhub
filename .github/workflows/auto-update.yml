name: Auto Update ToolHub

on:
  schedule:
    # 每周一北京时间 06:00 (UTC 周日 22:00)
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: '更新模式: full / discover / metrics / purge'
        required: false
        default: 'full'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run auto update
        env:
          TOOLHUB_UPDATE_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: python scripts/auto_update.py

      - name: Commit changes
        run: |
          git config user.name "toolhub-bot"
          git config user.email "toolhub-bot@users.noreply.github.com"
          git add data/ai-tools.json data/ai-websites.json data/manifest.json data/update_log.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update tool rankings and discover new plugins"
            git push
          fi
