<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 工具合集</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app">
    <!-- 顶部导航栏 -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-cube"></i>
        </div>
        <span>AI Nexus</span>
      </div>
      <div class="header-right">
        <div class="sync-indicator" id="syncIndicator" title="数据同步状态">
          <span class="sync-dot" id="syncDot"></span>
          <span class="sync-text" id="syncText">已同步</span>
        </div>
        <button class="refresh-btn" id="refreshBtn" title="手动刷新数据">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </header>

    <!-- 搜索框 -->
    <div class="search-wrap">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="搜索 AI 工具名称..." autocomplete="off">
        <button class="clear-btn" id="clearSearch" style="display:none;">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- 分类 Tab 栏 -->
    <div class="tabs-wrap">
      <nav class="tabs" id="tabsNav">
        <button class="tab active" data-category="all">全部</button>
        <!-- 动态渲染后填入各分类 Tab -->
      </nav>
    </div>

    <!-- 工具卡片列表 -->
    <main class="tools-list" id="toolsList">
      <!-- 骨架屏占位 -->
      <div class="skeleton-list" id="skeletonList">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </main>

    <!-- 底部状态栏 -->
    <footer class="footer" id="footer">
      <span id="footerLastUpdated">正在加载数据...</span>
      <a href="https://chromewebstore.google.com/" target="_blank" class="footer-link">
        访问应用商店 <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
